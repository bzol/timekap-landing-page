<!DOCTYPE html>
<html>
<head>
  <script>
    // Check if the current URL path contains 'privacy-policy'
    if (window.location.pathname.includes('privacy-policy')) {
      window.location.href = '/privacy-policy';
    } else {
      // For all other 404 cases, redirect to home
      window.location.href = '/';
    }
  </script>
</head>
</html>
